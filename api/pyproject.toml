[project]
name = "radar-api"
version = "0.1.0"
description = "API estatistica do Radar ENEM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.100", "ruff>=0.6", "scipy>=1.14", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Deprecacoes internas de starlette/anyio: nao ha o que corrigir do nosso lado.
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore::DeprecationWarning:anyio.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
