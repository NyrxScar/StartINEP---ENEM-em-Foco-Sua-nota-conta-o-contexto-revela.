# Servidor estatico do frontend do Radar ENEM.
#
# A porta 8080 e o usuario nao-root vem da imagem `nginx-unprivileged`; este
# arquivo so descreve como servir o build do Vite.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # Compressao: o bundle e majoritariamente texto.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # O Vite versiona cada arquivo de `assets/` pelo hash do conteudo, entao o
    # cache pode ser imutavel: um deploy novo gera nomes novos.
    # Um unico `Cache-Control`: `expires` emitiria um segundo cabecalho com
    # `max-age`, e duas linhas conflitantes na mesma resposta sao uma armadilha
    # para qualquer cache intermediario.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # `index.html` nunca e cacheado: e ele que aponta para os assets com hash,
    # e um index velho manteria o navegador em uma versao antiga do app.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Aplicacao de pagina unica: qualquer rota conhecida do React Router
    # (/panorama, /comparativo, ...) precisa devolver o index para que o
    # roteamento do cliente assuma. Sem isto, recarregar a pagina em uma rota
    # interna daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabecalhos de seguranca basicos para um app puramente estatico.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
}
