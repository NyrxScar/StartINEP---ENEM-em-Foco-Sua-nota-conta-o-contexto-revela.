edicao: 2022
versao_contrato: 1

fonte:
  url: "https://download.inep.gov.br/microdados/microdados_enem_2022.zip"
  arquivo_csv: "DADOS/MICRODADOS_ENEM_2022.csv"
  separador: ";"
  encoding: "latin-1"

# 2022 tem a mesma forma de 2021 e 2023: arquivo unico de 76 colunas com as notas
# e o perfil socioeconomico na mesma linha, ligados pelo mesmo participante.
# Sustenta o corte "nota x perfil" completo.
#
# O ZIP desta edicao traz um terceiro CSV, QUEST_HAB_ESTUDO.csv (272 MB), com o
# questionario de habitos de estudo aplicado em 2022. Ele nao e ingerido: nao ha
# coluna canonica que o receba, e acrescentar uma exigiria decidir como trata-lo
# nas demais edicoes, que nao o publicam. Ver ADR-0004.
#
# O caminho dentro do ZIP e diferente do de 2023: aqui os dados estao em
# DADOS/ na raiz do pacote, sem a pasta microdados_enem_<ano>/ que as edicoes
# recentes acrescentaram (verificado com zipfile.namelist()).

# canonico: COLUNA_DE_ORIGEM
mapeamento:
  ano: NU_ANO
  uf_prova: SG_UF_PROVA
  municipio_prova: NO_MUNICIPIO_PROVA
  localizacao_escola: TP_LOCALIZACAO_ESC
  faixa_etaria: TP_FAIXA_ETARIA
  sexo: TP_SEXO
  cor_raca: TP_COR_RACA
  tipo_escola: TP_ESCOLA
  dependencia_adm_escola: TP_DEPENDENCIA_ADM_ESC
  treineiro: IN_TREINEIRO
  renda_familiar: Q006
  escolaridade_pai: Q001
  escolaridade_mae: Q002
  presenca_cn: TP_PRESENCA_CN
  presenca_ch: TP_PRESENCA_CH
  presenca_lc: TP_PRESENCA_LC
  presenca_mt: TP_PRESENCA_MT
  nota_cn: NU_NOTA_CN
  nota_ch: NU_NOTA_CH
  nota_lc: NU_NOTA_LC
  nota_mt: NU_NOTA_MT
  nota_redacao: NU_NOTA_REDACAO

derivadas:
  regiao: regiao_por_uf

ausentes:
  codigo_escola: >-
    CO_ESCOLA nao existe entre as 76 colunas de MICRODADOS_ENEM_2022.csv. Em 2022
    o identificador de instituicao ainda estava fora dos microdados do ENEM; o
    INEP so voltou a publica-lo na edicao seguinte em que a coluna reaparece,
    2024. A escola aqui e caracterizada por
    atributos (dependencia administrativa, localizacao urbana/rural), nunca
    identificada. Ver ADR-0004.
